#
# Derived rather than captured, and the annotation says so by naming all three
# upstreams. Each file is one JSON document that mixes an Open-Meteo forecast,
# an Open-Meteo air-quality reading and - for two of the four - alerts from the
# NWS or from ECCC, put through our own encoder. There is no way to split the
# obligations file by file because they are interleaved inside one object, so
# the licence expression carries all of them and the attribution lists every
# service whose data is in there.
#
# Our contribution is the *shape*, which is GPL-3.0-or-later like the rest of
