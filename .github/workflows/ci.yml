# SPDX-License-Identifier: GPL-3.0-or-later
#
# Continuous integration.
#
# ---- why every job runs inside the flake -------------------------------------
#
# flake.lock pins nixpkgs by revision, so `nix develop` gives the same Qt, the
# same compiler, the same FreeType and the same fontconfig on a maintainer's
# laptop and on a runner - down to the store hash. That is what makes the golden
# images comparable across machines at all, and it is a stronger guarantee than
# the digest-pinned container docs/07 assumed, because it also covers the local
# case: a developer who runs `nix develop -c ctest` is running what CI runs, not
# something close to it.
#
# It is deliberately not the only thing that ever builds this. `linux-system-qt`
# below builds against a distribution's own Qt with no Nix anywhere, because
# that is what a packager does, and a project that only builds inside its own
# pinned environment discovers on release day that it depends on it.
#
# ---- why every `uses:` is a commit hash -------------------------------------
#
# The same argument, one layer out. A tag is a name somebody else can move: the
# owner of an action, or anyone who takes their account, can point v4 at new
# code tomorrow and it runs here with a token. A commit hash cannot be moved
# without changing the hash.
#
# The version is in the comment beside it so the line is still readable, and
# Dependabot updates both together - .github/dependabot.yml says why actions are
# the one ecosystem this repository watches at all. `zizmor` in the lint job
# below is what stops an unpinned one arriving.
#
# `persist-credentials: false` on every checkout is the other half of that. By
# default the action writes the job's token into .git/config and leaves it
# there, where any later step that packages the working tree can carry it off
# the runner. Nothing in this file pushes, so nothing here needs it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Once a week as well, because this repository can go a fortnight without a
  # commit and every job here depends on something outside it: a nixpkgs
  # revision that has to still be in the cache, a runner image, an apt archive,
  # an aqtinstall mirror. A build that stops working while nobody is pushing is
  # a build that breaks on the day somebody is in a hurry.
  schedule:
    - cron: '17 5 * * 1'

# A second push to a pull request cancels the first. The golden job renders
# thirty-two scenes and there is nothing to learn from a run against a commit
# that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- the whole suite, in the pinned environment ---------------------------
  #
  # Tests and golden images in one job rather than two. They share a build that
  # takes longer than either of them runs, and splitting would mean building
  # twice to report the same information in two places.
  test:
    name: test (nix)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Configure
        run: |
          nix develop --command cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCLIMAT_BUILD_TESTS=ON \
            -DCLIMAT_BUILD_GALLERY=ON \
            -DCLIMAT_DEV_TOOLS=ON

      - name: Build
        run: nix develop --command cmake --build build/ci

      # tst_environment runs first by way of its DEPENDS, so a rasterisation
      # change is reported as one sentence about the machine rather than as
      # thirty-two image diffs. See tests/tst_environment.cpp.
      - name: Test
        run: nix develop --command ctest --test-dir build/ci --output-on-failure

      # The renderings that did not match, so a golden failure can be looked at
      # rather than only read about. `if: failure()` because on a green run
      # there is nothing here to collect.
      - name: Upload the images that differed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden-actual
          path: tests/golden/images/*.actual.png
          if-no-files-found: ignore

      # The two licence questions only a linked binary can answer: is a
      # GPLv3-only Qt module in the DT_NEEDED list, and is Qt linked
      # dynamically. All FOUR shipped binaries - climat-cli is installed by the
      # .deb and the MSI like the rest. cmake/ClimatLicenceGuard.cmake catches the way that mistake
      # is normally made - a banned name in a find_package or a link line - and
      # cannot see a module that arrives through a QML import or another
      # module's dependency graph. This is risk R2 and R3 in
      # docs/08-risks.md, and static linking would silently relicense the
      # application.
      #
      # The script existed and nothing called it, which for a compliance check
      # is the same as it not existing. All FOUR shipped binaries, because
      # climat-cli, climat-widget and climat-daemon are as much a release artefact
      # as the app.
      - name: Licence-compatible linking
        run: |
          nix develop --command bash scripts/check-licences.sh \
            build/ci/app/climat build/ci/cli/climat-cli \
            build/ci/daemon/climat-daemon build/ci/widgets/climat-widget

      # The desktop entry, the AppStream component and the icons, checked from
      # a staged install rather than from the templates - so this covers the
      # install rules too, which is where half of the silent failures live.
      #
      # It runs here, in the job that has a built tree, rather than in `lint`,
      # which configures but never builds: `cmake --install` needs the binary
      # it was told to install. The devshell carries appstreamcli,
      # desktop-file-validate and librsvg for exactly this step.
      - name: Packaging metadata
        run: CLIMAT_BUILD_DIR=build/ci nix develop --command bash scripts/check-packaging.sh

      # The README's device images, re-rendered and diffed against what is
      # committed. They are composed out of the real shells at real breakpoints,
      # so this is the check that stops the front page of the project showing a
      # layout the app stopped producing - the failure mode a screenshot pasted
      # into a README has always had and never reported.
      - name: README device images
        run: CLIMAT_BUILD_DIR=build/ci nix develop --command bash scripts/shots.sh check

      # What the runner actually rendered, when it did not match. The golden
      # step above has had this since it was written and this one did not, which
      # is why a red README-image job could only be read about: the comparison
      # happens in a temporary directory that the run then deletes.
      - name: Upload the device images that differed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shots-actual
          path: docs/images/*.actual.png
          if-no-files-found: ignore

      # The desktop widgets, against a real compositor. `WLR_BACKENDS=headless
      # sway` needs no GPU, no seat and no display, and wlroots is the reference
      # implementation of the protocol KWin also speaks - so this is the KDE and
      # Sway story actually being exercised rather than compiled.
      #
      # It runs here rather than in `lint` for the reason the packaging step
      # does: it needs a built climat-widget. The script skips, loudly, if sway
      # cannot start on the runner at all - a machine that cannot host a
      # compositor has said nothing about this code - and fails for every other
      # reason.
      - name: Desktop widgets pin themselves
        run: nix develop --command bash scripts/check-layer-shell.sh build/ci/widgets/climat-widget

  # ---- a packager's build --------------------------------------------------
  #
  # Debian 13 ships Qt 6.8, which is the floor D2 sets, and this is the job that
  # keeps the floor honest: no Nix, no flake, nothing fetched at configure time,
  # only what apt provides. D8 in docs/03-tech-stack.md rules out Conan and
  # vcpkg precisely so that this build is possible, and an assertion nobody runs
  # is not an assertion.
  #
  # Golden images are not checked here and that is deliberate. A different Qt
  # renders different pixels, which is a fact about Qt rather than a defect in
  # this application, and tst_environment would correctly refuse the comparison.
  # `-E golden` excludes it by the label tests/CMakeLists.txt gives it.
  linux-system-qt:
    name: build (debian 13, system Qt)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: debian:trixie
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            libqt6sql6-sqlite libgl1-mesa-dev

      - name: Configure
        run: |
          cmake -S . -B build/deb -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCLIMAT_BUILD_TESTS=ON \
            -DCLIMAT_BUILD_GALLERY=ON \
            -DCLIMAT_DEV_TOOLS=ON

      - name: Build
        run: cmake --build build/deb

      - name: Test, without the golden images
        run: ctest --test-dir build/deb -LE golden --output-on-failure

  # ---- the other shipping desktop --------------------------------------------
  #
  # Windows is one of the two release targets, so it is built on every change
  # rather than discovered at tag time. Qt comes from aqtinstall because there
  # is no system Qt to speak of; that is a build-time dependency of CI only and
  # does not touch D8, which is about what a *packager* needs.
  #
  # Golden images are excluded, and not only for the reason the Debian job
  # excludes them. Windows renders text through DirectWrite rather than
  # FreeType, so `FONTCONFIG_FILE` means nothing there and the images could not
  # match however carefully the environment were pinned. docs/09 already draws
  # this distinction for screenshots: an honest Windows picture comes from a
  # real window, and it is documentation rather than a comparison.
  #
  # This is the one job in the file that has never been run - everything else
  # here was executed locally before being committed, the Debian build inside
  # the same container image it names. Treat its first run as the test of it.
  windows-msvc:
    name: build (windows, msvc)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same modules the release job installs - release.yml adds
      # qtpositioning, and for a while this job did not, so the build CI
      # exercised was not the one the MSI ships: "use my location" was
      # compiled out here and in on the release runner. One list, both places.
      #
      # qtdeclarative is not in that list and must not go back into it. Qt Quick
      # ships inside the base package rather than as an add-on module, so naming
      # it sends aqtinstall looking for a package that does not exist and the job
      # dies before it downloads anything: "The packages ['qtdeclarative'] were
      # not found while parsing XML of package information!". That is what this
      # job did from the day it was written until 2026-09-19.
      - uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: '6.8.3'
          modules: 'qtpositioning'
          cache: true

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Configure
        run: >
          cmake -S . -B build/win -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCLIMAT_BUILD_TESTS=ON
          -DCLIMAT_BUILD_GALLERY=ON
          -DCLIMAT_DEV_TOOLS=ON

      - name: Build
        run: cmake --build build/win

      - name: Test, without the golden images
        run: ctest --test-dir build/win -LE golden --output-on-failure

  # ---- the third desktop, as far as a runner can take it --------------------
  #
  # docs/07 §7.3 has listed a macos-arm64 job since the plan was written and
  # this file never had one, so "there is no macOS build" in docs/known-gaps.md
  # was true twice over: nothing shipped, and nothing was ever compiled. This
  # job makes the second half a measurement. It builds an unsigned .app and
  # runs the suite without the golden images - CoreText is not FreeType, for
  # the reason the Windows job gives - and it ships nothing, because shipping
  # needs the Developer ID the gap entry is about.
  #
  # Like the Windows job above, this has never been run. Treat its first run
  # as the test of it.
  macos-arm64:
    name: build (macos, arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Modules as in the Windows job above, which says why qtdeclarative is
      # not among them.
      #
      # Not 6.8.3 like Windows. Its CMake links Apple's AGL framework, which
      # the current macOS SDK no longer has, and the fix never reached an open
      # source 6.8 release: "ld: framework 'AGL' not found". The 6.8 floor is
      # Debian's, and the Debian job above proves it. A Mac build carries its
      # own Qt, so it takes the one the devshell pins.
      - uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: '6.11.1'
          modules: 'qtpositioning'
          cache: true

      # The Linux jobs get ninja from the devshell or from apt, and the Windows
      # one from the MSVC environment. This job installs Qt and nothing else, so
      # it has to say where its generator comes from rather than hoping the
      # runner image carries one.
      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build/mac -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCLIMAT_BUILD_TESTS=ON
          -DCLIMAT_BUILD_GALLERY=ON
          -DCLIMAT_DEV_TOOLS=ON

      - name: Build
        run: cmake --build build/mac

      - name: Test, without the golden images
        run: ctest --test-dir build/mac -LE golden --output-on-failure

  # ---- everything that reads the tree rather than building it ---------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Every file carries copyright and licensing. This is the check that
      # keeps the MPL-2.0 engine and the GPL-3.0-or-later application apart,
      # which is the whole of D6.
      - name: reuse lint
        run: nix develop --command reuse lint

      - name: shellcheck
        run: nix develop --command shellcheck --external-sources scripts/*.sh

      # The workflows themselves, which nothing else checks until they run.
      # That gap is worst exactly where it costs most: a release workflow is
      # exercised by tagging a release, so a mistake in it is discovered by
      # publishing a broken one. actionlint also pipes every `run:` block
      # through shellcheck, which is the half of a workflow that is really a
      # shell script nobody lints.
      - name: actionlint
        run: nix develop --command actionlint

      # What actionlint does not look for: an action named by a tag its owner
      # can move, a job holding a token wider than its steps need, a checkout
      # that leaves its credential on the runner. It reported 40 findings
      # against these three files the day it was added and none now, so this is
      # a gate rather than a ratchet.
      - name: zizmor
        run: nix develop --command zizmor --no-progress .github/workflows

      # Spelling, over the whole tree. .typos.toml records everything it found
      # on the day it arrived and why each one is not a misspelling, so a
      # failure here is a new word rather than an old argument.
      - name: typos
        run: nix develop --command typos

      # Relative links between the Markdown files, and the anchors inside them.
      # Offline: the network is not a thing to make a pull request depend on,
      # and .github/workflows/maintenance.yml follows the external ones weekly.
      - name: Links between the documents
        run: nix develop --command bash -c 'git ls-files "*.md" | xargs lychee --offline --no-progress --include-fragments'

      # Every link back to this project, against each other and against the
      # repository this is running in. A rename leaves a tree that agrees with
      # itself and disagrees with reality, which is silent everywhere except a
      # published store page. Not --strict here: a pull request should not go
      # red over a repository setting nobody in the diff can change. The release
      # workflow runs it --strict and refuses to publish.
      - name: Project URLs
        run: nix develop --command bash scripts/check-urls.sh

      # The explicit QML_FILES lists against what is on disk. A globbed module
      # goes stale silently; this is what stops a file being added to the tree
      # and not to the module that is supposed to contain it.
      - name: QML module file lists
        run: nix develop --command bash scripts/check-qml-files.sh

      # The GNOME Shell extension, as far as a runner can reach it: both modules
      # parse as ES modules, the D-Bus introspection XML parses and matches what
      # the extension calls, metadata.json is well formed and the GSettings
      # schema compiles --strict.
      #
      # gjs comes from apt rather than from the devshell, and the mutter typelib
      # is absent on a runner - so the WaylandClient check SKIPS here and the
      # script says so. That is the one assertion that needs a GNOME, and it is
      # exactly why scripts/shell-probe.sh is a manual acceptance test: standing
      # a shell up on a runner would test that stack rather than the one users
      # have.
      - name: install gjs
        run: sudo apt-get update && sudo apt-get install -y gjs

      - name: GNOME Shell extension
        run: nix develop --command bash scripts/check-extension.sh

      # ---- there is deliberately no clang-format step here --------------------
      #
      # Measured before deciding, over every .cpp and .h in the tree:
      #
      #   Microsoft   5,585 replacements      LLVM      20,508
      #   WebKit      6,564                   Mozilla   21,108
      #   Chromium   22,488                   Google    22,508
      #   GNU        35,380
      #
      # and a config hand-tuned on the closest of them still wanted 2,719. This
      # C++ was written by hand against no formatter and matches none of them.
      #
      # So the choice is a single enormous reformat commit or no gate, and the
      # reformat is the worse one. It would rewrite `git blame` for every line
      # of a codebase whose distinguishing feature is its comments, and
      # ReflowComments is exactly the setting that would tear up the aligned
      # prose those comments are written in - the same reason docs/09 records
      # that qmlformat must never be run over the QML.
      #
      # The gap this leaves is real and worth stating: new C++ is reviewed for
      # style by a person. If that stops working, the answer is to tune a
      # .clang-format down to zero replacements against the tree as it stands
      # and adopt it in a commit that does nothing else - not to adopt a
      # standard style and reformat to meet it.

      # The translatable strings against the source they came from. A string
      # added to a .qml or a .cpp and not to the template is a string no
      # translator is ever offered, and the template is committed precisely so
      # that a pull request adding a user-facing sentence shows that sentence
      # in its diff. scripts/i18n.sh explains the two lupdate flags that make
      # this a gate rather than a nuisance.
      - name: Translatable strings
        run: nix develop --command bash scripts/i18n.sh check

      # Needs a configured build for the all_qmllint target, but not a compiled
      # one - qmllint reads sources and the module metadata that configuring
      # writes.
      - name: Configure, for qmllint
        run: |
          nix develop --command cmake -S . -B build/lint -G Ninja \
            -DCLIMAT_BUILD_TESTS=OFF -DCLIMAT_BUILD_GALLERY=ON

      - name: qmllint, as a ratchet
        run: CLIMAT_BUILD_DIR=build/lint nix develop --command bash scripts/check-qmllint.sh

  # ---- Android ---------------------------------------------------------------
  #
  # The APK, built the way scripts/android.sh builds it on a laptop - from
  # that script - so that "it builds in CI" and "it builds for me" are one
  # claim rather than two. First run 2026-09-17 against Qt 6.11.1, NDK 27.2,
  # platform 36 and build-tools 36.0.0, which are the versions Qt 6.11 names.
  #
  # What it establishes: that the package builds, declares what
  # app/CMakeLists.txt says it declares, and carries a TLS library. What it
  # does not: that the app is right on a phone. docs/known-gaps.md has what
  # has and has not been looked at on a screen.
  android:
    name: build (android, arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # The desktop Qt too, and it is not optional: androiddeployqt runs the
      # host's qmlimportscanner and moc, so a cross build needs a host Qt of
      # exactly the same version beside the target one. Desktop first, kit
      # second, because the second step's QT_ROOT_DIR is what the build reads
      # and the host is found as its gcc_64 sibling.
      - name: Install the host Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtpositioning'
          cache: true

      # `host: all_os` is not decoration. From 6.7 Qt publishes one Android
      # package for every desktop, so aqtinstall files it under the pseudo-host
      # `all_os` and looking on `linux` - which is what this action defaults to -
      # finds nothing: "check that versions of qt exist within the spec
      # '6.11.1'". That is what this job did on every run until 2026-09-19. The
      # desktop step above keeps `host: linux`, because a host Qt is a real
      # Linux build.
      - name: Install Qt for Android
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: '6.11.1'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: 'qtpositioning'
          cache: true

      # The runner ships an SDK; these are the pieces Qt 6.11 asks for that it
      # may not. cmake from the SDK rather than the runner's, for the reason
      # scripts/android.sh gives. patchelf is what gives the OpenSSL libraries
      # the sonames Qt loads them by.
      - name: Install the SDK pieces Qt 6.11 wants
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.31.6" > /dev/null
          sudo apt-get update && sudo apt-get install -y patchelf

      - name: OpenSSL for arm64-v8a
        run: scripts/android-openssl.sh

      - name: Build the APK
        env:
          CLIMAT_QT_ANDROID: ${{ env.QT_ROOT_DIR }}
          CLIMAT_QT_HOST: ${{ env.QT_ROOT_DIR }}/../gcc_64
        run: scripts/android.sh apk

      # Into the log, so that a permission Qt's modules added or a target SDK
      # that moved is something a reviewer reads rather than something Play
      # tells the publisher about later.
      - name: Say what the package declares
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging \
            build/android/app/android-build/climat.apk \
            | grep -E '^package|sdkVersion|targetSdk|uses-permission|native-code'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: climat-apk
          path: build/android/app/android-build/climat.apk
          if-no-files-found: error
