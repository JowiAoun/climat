# SPDX-FileCopyrightText: 2026 Jowi Aoun
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Cuts a release: builds every shipping artefact, then publishes them together
# with the things a release legally and practically has to carry.
#
# Triggered by the tag that release-please pushes when its pull request merges,
# so the normal path is: merge the release PR, and this runs. workflow_dispatch
# is there to rehearse it without cutting anything.
#
# ==== what gets attached, and why each one is not optional ==================
#
#   the artefacts        .deb, .flatpak, .msi, .zip, .AppImage, .aab, .apk
#   SHA256SUMS           the only way to check a download that is not signed
#   climat.spdx           an SBOM, generated by `reuse spdx` from the same SPDX
#                        metadata `reuse lint` gates on every commit - so it
#                        describes the tree rather than somebody's memory of it
#   THIRD-PARTY-LICENCES the binary carries Inter, the GeoNames index and
#                        recorded ECCC, NWS and Open-Meteo payloads. Five
#                        licences that are not ours, in a program that would
#                        otherwise appear to be GPL and nothing else.
#   QT-SOURCE-OFFER      LGPLv3 section 4 plus GPLv3 section 6. A link to
#                        qt.io does not discharge it - docs/07 §7.4 is explicit
#                        and correct about that.
#   build provenance     attests that these bytes came out of this workflow at
#                        this commit. It is the closest thing to a signature
#                        available to a project with no certificate, and it is
#                        what `gh attestation verify` checks.
#
# ==== what is NOT here ======================================================
#
# No code signing on the desktop. There is no Windows certificate and no
# Apple Developer ID, so the Windows artefacts trip SmartScreen and there is no
# macOS artefact at all. Both are recorded in docs/known-gaps.md with the
# mitigations, in order. Do not add a signing step here that quietly does
# nothing when the secret is absent - an unsigned build that believes it is
# signed is worse than one that knows it is not.
#
# Android is the one platform that IS signed, when the upload key is in the
# repository's secrets - and when it is not, the job says so in the log and
# the report below says so on the release page, because an unsigned bundle is
# one Play will not take. docs/releasing.md says what the four secrets are.
#
# Every `uses:` is a commit hash and every checkout sets
# `persist-credentials: false`, for the reasons ci.yml gives at length. This
# file matters more: it is the one that runs with a token that can write.
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Read, for every job that only builds something. The one job that writes -
# `publish` - asks for more where it is declared, which is the only place a
# reader looking at a step can see what token it had.
#
# This was `contents: write` plus `id-token: write` plus `attestations: write`
# for the whole file, so five jobs that compile code and upload an artefact were
# each handed a token that can rewrite the repository and mint an attestation.
# None of them needs it. A release builds third-party code - a KDE tarball, an
# OpenSSL tarball, linuxdeploy off the internet - and that is exactly the shape
# of job to hand the smallest possible token.
permissions:
  contents: read

concurrency:
  # One release at a time. Two tags pushed together would otherwise race to
  # attach artefacts to two releases through the same `gh release edit`, and
  # `cancel-in-progress: false` because the loser of that race is a release that
  # was half-published rather than one nobody wanted.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- the one thing worth checking before building anything -----------------
  #
  # Seconds, and it runs first because the failure it catches is one that no
  # artefact can be repaired after the fact: a release whose store page, bug
  # tracker, privacy policy and screenshots all point at a repository that is
  # not there. scripts/check-urls.sh says what to do about it. `--strict` here
  # and not in ci.yml, because a pull request cannot fix a repository name and a
  # release must not ship around one.
  #
  # Needs no Nix and no Qt: bash, git and sed.
  check:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Project URLs
        run: bash scripts/check-urls.sh --strict

  # ---- Debian and derivatives ------------------------------------------------
  #
  # In the distribution it is for. The Depends field is derived by
  # dpkg-shlibdeps from the binary's DT_NEEDED entries, so it is only correct
  # when the Qt that was linked is the Qt Debian ships. See cmake/ClimatCPack.cmake.
  deb:
    name: .deb (debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `file` is what CPack runs to find the binaries dpkg-shlibdeps reads the
      # Depends field from. The container does not have it, and without it the
      # package step fails after the whole build. scripts/deb.sh installs the
      # same list.
      - name: Install the build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config file \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            libqt6sql6-sqlite libgl1-mesa-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIMAT_BUILD_TESTS=OFF \
            -DCLIMAT_BUILD_GALLERY=OFF \
            -DCLIMAT_DEV_TOOLS=OFF
          cmake --build build

      - name: Package
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb
          path: build/*.deb
          if-no-files-found: error

  # ---- Flathub's format, as a single file ------------------------------------
  #
  # The P0 channel. This produces a .flatpak bundle for the release page, which
  # is not the same thing as a Flathub submission - that lives in its own
  # repository with a git-sourced manifest, and this is what somebody installs
  # from a download before we are on Flathub at all.
  flatpak:
    name: .flatpak
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # elfutils because flatpak-builder strips each module with the host's
      # eu-strip, not the SDK's, and the runner image does not have it.
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak flatpak-builder elfutils

      # Reads the runtime version out of the manifest rather than repeating it
      # here, so this cannot install a runtime the manifest does not ask for.
      - name: Install the runtime and SDK
        run: scripts/flatpak.sh deps

      - name: Build the bundle
        run: scripts/flatpak.sh bundle

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak
          path: build/*.flatpak
          if-no-files-found: error

  # ---- the portable Linux build ----------------------------------------------
  #
  # Written where nothing could run it, so it was `continue-on-error` until it
  # built one. That was a rehearsal on 2026-09-30, after the two plugin fixes
  # below, and it is an ordinary required job from then on.
  #
  # 22.04 for glibc 2.35: an AppImage runs on any distribution whose glibc is
  # at least as new as the one it was built against, so the build environment
  # is the compatibility floor. If this runner label is retired, the fix is a
  # container, not a newer runner.
  appimage:
    name: .AppImage (glibc 2.35)
    runs-on: ubuntu-22.04
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: '6.8.3'
          modules: 'qtpositioning'
          cache: true

      - name: Version
        run: bash scripts/release-version.sh >> "$GITHUB_ENV"

      - name: Install linuxdeploy
        run: |
          mkdir -p tools
          cd tools
          for tool in linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage; do
            curl -fsSLO "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/$tool" \
              || curl -fsSLO "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/$tool"
            chmod +x "$tool"
          done

      - name: Build and stage
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIMAT_BUILD_TESTS=OFF \
            -DCLIMAT_BUILD_GALLERY=OFF \
            -DCLIMAT_DEV_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR="$PWD/AppDir" cmake --install build

      # The AppImage bundles Qt, so it conveys it, so it carries the offer and
      # the licence bundle. Same obligation as the Windows artefacts and the
      # same two files. COPYING.LESSER is the LGPLv3 text itself, which section
      # 4(b) asks to travel with Qt as the GPL text travels with the app.
      - name: Add the licence files a bundled Qt requires
        run: |
          scripts/licence-bundle.sh AppDir/THIRD-PARTY-LICENCES.txt
          cp packaging/QT-SOURCE-OFFER.txt AppDir/
          cp LICENSE COPYING.LESSER AppDir/

      # The Qt plugin deploys every plugin it finds for a module the app links,
      # and a plugin whose own dependency is missing fails the whole step. The
      # app uses one SQL driver of seven: the rest drag in the PostgreSQL and
      # MySQL clients, and the Mimer one needs a library the runner does not
      # have. The NMEA position plugin needs Qt SerialPort, which is not
      # installed, and reads a serial GPS the app never asks for; on Linux the
      # default source is GeoClue2.
      - name: Keep only the plugins the app loads
        run: |
          find "$QT_ROOT_DIR/plugins/sqldrivers" -type f ! -name 'libqsqlite.so' -delete
          rm -f "$QT_ROOT_DIR/plugins/position/libqtposition_nmea.so"

      - name: Package
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake6
          EXTRA_QT_MODULES: 'quick;qml'
        run: |
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/io.github.JowiAoun.Climat.desktop \
            --icon-file packaging/icons/climat-256.png
          # linuxdeploy names the file after the desktop entry, Climat-x86_64,
          # with no version. 0.1.0 shipped under that name; every artefact
          # after it is named the way the others are.
          mv Climat*-x86_64.AppImage "climat-$CLIMAT_RELEASE_VERSION-x86_64.AppImage"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage
          path: '*.AppImage'
          if-no-files-found: error

  # ---- the other shipping desktop --------------------------------------------
  #
  # Both artefacts come out of ONE staged tree, and that is a licensing
  # decision rather than a tidiness one. Windows bundles Qt, so both the ZIP and
  # the MSI convey it; staging once and packaging twice means there is no route
  # to a Windows artefact that skipped the two licence files. It is also why
  # cmake/ClimatCPack.cmake deliberately defines no Windows generator.
  windows:
    name: .msi and .zip (windows x64)
    runs-on: windows-latest
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: '6.8.3'
          modules: 'qtpositioning'
          cache: true

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # From the tag when there is one, and from CMakeLists.txt when this was
      # dispatched by hand - otherwise a rehearsal off a branch produces
      # `climat-main-windows-x64.msi`, which is a file nobody can identify a
      # week later.
      - name: Version
        shell: bash
        run: bash scripts/release-version.sh >> "$GITHUB_ENV"

      # windeployqt runs as part of `cmake --install`, so the staged tree comes
      # out with Qt already beside the executable - see the WIN32 block in
      # app/CMakeLists.txt.
      - name: Build and stage
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIMAT_BUILD_TESTS=OFF \
            -DCLIMAT_BUILD_GALLERY=OFF \
            -DCLIMAT_DEV_TOOLS=OFF
          cmake --build build
          # Absolute, and in Windows form: Qt's deploy step refuses a relative
          # prefix when it writes qt.conf, and CMake cannot read /d/a/... paths.
          cmake --install build --prefix "$(cygpath -m "$PWD")/stage"

      - name: Add the licence files a bundled Qt requires
        shell: bash
        run: |
          scripts/licence-bundle.sh stage/THIRD-PARTY-LICENCES.txt
          cp packaging/QT-SOURCE-OFFER.txt stage/
          cp LICENSE COPYING.LESSER stage/

      - name: Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path stage\* `
            -DestinationPath "climat-$env:CLIMAT_RELEASE_VERSION-windows-x64.zip"

      - name: MSI
        shell: pwsh
        run: |
          # Pinned. Unpinned, this installed WiX 7, which refuses to run until
          # its maintenance-fee EULA is accepted. 5 is what the .wxs was written
          # for and carries no such term.
          dotnet tool install --global wix --version 5.0.2

          # Absolute bind paths. WiX resolves a relative one against the .wxs
          # file's folder, and a stage it cannot find is only a warning: the
          # first MSI built here harvested no files and the job passed. -wx
          # makes that, and every other warning, fail the build.
          #
          # And the numbers only. A rehearsal's 0.1.0-dev is not an MSI
          # version; the file name keeps the suffix.
          $version = $env:CLIMAT_RELEASE_VERSION -replace '-.*$', ''
          wix build packaging\windows\climat.wxs `
            -wx `
            -d Version=$version `
            -bindpath "stage=$PWD\stage" `
            -bindpath "icons=$PWD\packaging\icons" `
            -o "climat-$env:CLIMAT_RELEASE_VERSION-windows-x64.msi"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: |
            *.msi
            *.zip
          if-no-files-found: error

  # ---- Android ---------------------------------------------------------------
  #
  # The same steps as ci.yml's android job, then the bundle Play takes and the
  # APK a reader installs by hand, and the OpenSSL licence beside them:
  # Apache-2.0 asks that a copy travel with the binaries, and this package is
  # the one artefact that carries OpenSSL. See scripts/android-openssl.sh.
  android:
    name: .aab and .apk (android, arm64-v8a)
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the host Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: '6.11.1'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtpositioning'
          cache: true

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: '6.11.1'
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: 'qtpositioning'
          cache: true

      - name: Install the SDK pieces Qt 6.11 wants
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.31.6" > /dev/null
          sudo apt-get update && sudo apt-get install -y patchelf

      - name: OpenSSL for arm64-v8a
        run: scripts/android-openssl.sh

      - name: Version
        run: bash scripts/release-version.sh >> "$GITHUB_ENV"

      # The keystore is a file, and a secret is a string, so it travels as
      # base64 and is written to the runner's temp directory - never into the
      # checkout, where a later step could catalogue it. The three strings
      # beside it go straight to the build step's environment, which is where
      # Qt reads them.
      - name: The upload key, when there is one
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "QT_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_UPLOAD_KEYSTORE_BASE64 secret, so the bundle is unsigned and Play will not take it. docs/releasing.md says how to add the key."
          fi

      - name: Build the bundle and the APK
        env:
          CLIMAT_QT_ANDROID: ${{ env.QT_ROOT_DIR }}
          CLIMAT_QT_HOST: ${{ env.QT_ROOT_DIR }}/../gcc_64
          QT_ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          QT_ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          QT_ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          scripts/android.sh aab
          scripts/android.sh apk

      - name: Name them
        run: |
          out=build/android/app/android-build
          cp "$out/build/outputs/bundle/release/android-build-release.aab" \
            "climat-$CLIMAT_RELEASE_VERSION-android-arm64-v8a.aab"
          cp "$out/climat.apk" "climat-$CLIMAT_RELEASE_VERSION-android-arm64-v8a.apk"
          cp build/android-openssl/LICENSE-OpenSSL.txt .
          if jarsigner -verify "climat-$CLIMAT_RELEASE_VERSION-android-arm64-v8a.aab" | grep -q '^jar verified'; then
            echo "android: the bundle is signed"
          else
            echo "::warning::android: the bundle is NOT signed"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: |
            *.aab
            *.apk
            LICENSE-OpenSSL.txt
          if-no-files-found: error

  # ---- the screenshots a software centre shows -------------------------------
  #
  # The AppStream component has declared four <image> URLs under
  # https://<owner>.github.io/<repo>/screenshots/ since it was written, and
  # docs/releasing.md and docs/screenshots.md have both said for as long that
  # the release workflow published them. Nothing did. So all four have been dead
  # links from the first day: four broken images in GNOME Software and KDE
  # Discover, and a Flathub submission that fails its own linter on screenshots
  # it cannot fetch.
  #
  # This is that job. It renders them from the application itself with
  # scripts/store-shots.sh, which reads the names out of the metainfo so the two
  # cannot drift, and deploys them as the Pages site.
  #
  # Deployed rather than committed because AppStream wants a stable absolute URL
  # and a raw.githubusercontent link moves with the branch. `enablement: true`
  # turns Pages on the first time this runs, so there is no setting to remember.
  #
  # It is not in `needs:` for publish. A store screenshot that failed to deploy
  # is worth a red job and is not worth holding up a .deb.
  screenshots:
    name: store screenshots (Pages)
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      # A job's permissions replace the file's rather than adding to them, so
      # `contents: read` is spelled out here.
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Dev tools ON, unlike every other job in this file, and that is the
      # point: --grab is a development tool and a shipped binary does not have
      # it. Tests and the gallery are off - only the app is photographed.
      - name: Build the app, with its capture harness
        run: |
          nix develop --command cmake -S . -B build/shots -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCLIMAT_BUILD_TESTS=OFF \
            -DCLIMAT_BUILD_GALLERY=OFF \
            -DCLIMAT_DEV_TOOLS=ON
          nix develop --command cmake --build build/shots --target climat

      - name: Render them
        run: |
          CLIMAT_BUILD_DIR=build/shots nix develop --command \
            bash scripts/store-shots.sh site/screenshots

      # So the site root is not a 404 for anybody who trims the URL back.
      - name: A page at the root
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          {
            echo '<!doctype html><meta charset="utf-8">'
            echo '<title>Climat screenshots</title>'
            echo '<p>Screenshots for the AppStream component, published by the'
            echo "release workflow. The project is at <a href=\"$REPO_URL\">$REPO_URL</a>.</p>"
            echo '<ul>'
            for shot in site/screenshots/*.png; do
              name="$(basename "$shot")"
              echo "<li><a href=\"screenshots/$name\">$name</a></li>"
            done
            echo '</ul>'
          } > site/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # ---- publish ---------------------------------------------------------------
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [check, deb, flatpak, appimage, windows, android]
    permissions:
      # The release itself.
      contents: write
      # The two the provenance attestation needs: id-token to get an OIDC token
      # from GitHub, attestations to record the result.
      id-token: write
      attestations: write
    # always(), so that a failed AppImage - the one job allowed to fail - does
    # not take the release with it. The step below reports what arrived.
    #
    # And then one exception to always(), because it has exactly one: when the
    # preflight job fails, every build job is skipped and this one would publish
    # a release whose artefact report says MISSING against every line. The whole
    # point of a gate is that nothing downstream of it runs.
    if: always() && needs.check.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Generated BEFORE the artefacts land, and that ordering is not
      # cosmetic: `reuse spdx` walks the project directory, so a dist/ full of
      # binaries at this point would be catalogued as part of the source tree.
      # The SBOM has to describe what was built, not what the build produced.
      - name: The SBOM, the licence bundle and the source offer
        run: |
          mkdir -p meta
          nix develop --command reuse spdx -o meta/climat.spdx
          nix develop --command scripts/licence-bundle.sh meta/THIRD-PARTY-LICENCES.txt
          cp packaging/QT-SOURCE-OFFER.txt COPYING.LESSER meta/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: incoming

      - name: Gather
        run: |
          mkdir -p dist
          find incoming -type f \
            \( -name '*.deb' -o -name '*.flatpak' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*.zip' \
               -o -name '*.aab' -o -name '*.apk' -o -name 'LICENSE-OpenSSL.txt' \) \
            -exec mv {} dist/ \;
          mv meta/* dist/
          ls -la dist

      # No silent gaps. If an artefact did not arrive, the release notes say so
      # rather than simply not mentioning it - an absent file and a file nobody
      # promised look identical on a release page.
      - name: Report what arrived
        run: |
          {
            echo "### Artefacts"
            echo
            for want in .deb .flatpak .AppImage .msi .zip .aab .apk; do
              if ls dist/*"$want" > /dev/null 2>&1; then
                echo "- \`$want\` - built"
              else
                echo "- \`$want\` - **MISSING**, its job failed"
              fi
            done
          } | tee artefact-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # Everything in dist/, named by one glob that cannot miss.
      #
      # It used to be a list of five globs, one per artefact, and that was a
      # release-breaking bug rather than an untidy one: this action fails when a
      # subject path matches nothing, this job runs after a failed build job
      # too, and this step runs before `gh release upload`. So the first
      # release where one artefact did not build would have attested nothing
      # and published nothing.
      #
      # Attesting the SBOM, the licence bundle and SHA256SUMS along with the
      # binaries is not a side effect worth avoiding either. They are published
      # bytes and they make claims about the rest.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      # release-please creates the GitHub Release itself when its pull request
      # merges, with notes built from the conventional-commit history - so by
      # the time this runs the release usually already exists and already says
      # the right thing. Overwriting those notes with our own would throw away
      # the changelog; creating a second release is not possible. So: append if
      # it is there, create if it is not, and upload either way.
      # Only for a tag. `workflow_dispatch` exists to rehearse this workflow, and
      # without this condition a rehearsal off main ran `gh release create main`
      # and left a GitHub Release called "main" behind. Everything above still
      # runs on a dispatch - the artefacts, the report, the checksums, the
      # attestation - which is the whole of what a rehearsal is for.
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json body -q .body > body.md
            printf '\n\n' >> body.md
            cat artefact-report.md >> body.md
            gh release edit "$GITHUB_REF_NAME" --notes-file body.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes-file artefact-report.md
          fi

          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
